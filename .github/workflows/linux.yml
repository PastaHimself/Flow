name: Linux Desktop

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-linux:
    name: Build AMD64 DEB
    if: ${{ github.repository == 'PastaHimself/Flow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify repository safety
        run: test "$GITHUB_REPOSITORY" = "PastaHimself/Flow"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Linux packaging tools
        run: |
          command -v fakeroot
          command -v dpkg-deb
          command -v jpackage

      - name: Test Debian dependency normalization
        run: bash desktop/scripts/test-normalize-deb-dependencies.sh

      - name: Check Kotlin formatting
        run: ./gradlew spotlessCheck --build-cache --stacktrace

      - name: Compile and test desktop code
        run: >
          ./gradlew :shared:test :desktop:test :desktop:compileKotlin
          --build-cache --stacktrace

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^flow.desktopVersion=//p' gradle.properties)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z.+~-]*$ ]]; then
            echo "::error::Invalid Debian upstream version '$version'."
            exit 1
          fi
          ./gradlew :desktop:packageDeb -Pflow.desktopVersion="$version" --build-cache --stacktrace

          shopt -s nullglob
          packages=(desktop/build/compose/binaries/main/deb/*.deb)
          if (( ${#packages[@]} != 1 )); then
            echo "::error::Expected exactly one DEB, found ${#packages[@]}."
            exit 1
          fi

          mkdir -p dist-linux
          output="dist-linux/Flow-${version}-amd64.deb"
          cp "${packages[0]}" "$output"
          dpkg-deb --info "$output"

          assert_field() {
            local field=$1
            local expected=$2
            local actual
            actual=$(dpkg-deb -f "$output" "$field")
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Unexpected $field: expected '$expected', got '$actual'."
              exit 1
            fi
          }

          assert_dependency() {
            local package=$1
            if ! printf '%s\n' "$depends" |
              tr ',|' '\n\n' |
              sed -E 's/^[[:space:]]*//; s/[[:space:]]*(\([^)]*\))?[[:space:]]*$//' |
              grep -Fx "$package" >/dev/null; then
              echo "::error::DEB is missing required dependency '$package'."
              exit 1
            fi
          }

          assert_field Package flow
          assert_field Version "${version}-1"
          assert_field Architecture amd64
          assert_field Section video
          assert_field Maintainer "Flow <flow.aedev@gmail.com>"
          assert_field Description "Privacy-respecting YouTube client with local recommendations"

          depends=$(dpkg-deb -f "$output" Depends)
          for dependency in libasound2t64 libasound2 libpng16-16t64 libpng16-16 mpv yt-dlp ffmpeg; do
            assert_dependency "$dependency"
          done

          package_contents=$(dpkg-deb --contents "$output")
          grep -Eq '/opt/flow/bin/Flow$' <<< "$package_contents"
          grep -Eq '/opt/flow/lib/flow-Flow\.desktop$' <<< "$package_contents"
          grep -Eq '/opt/flow/lib/Flow\.png$' <<< "$package_contents"
          echo "DEB_PATH=$output" >> "$GITHUB_ENV"

      - name: Install and launch packaged application
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils xvfb xauth
          sudo install -d -m 0755 /usr/share/applications /usr/share/desktop-directories
          sudo apt-get install -y "./${DEB_PATH}"

          dpkg-query -W -f='${Status}\n' flow | grep -Fx 'install ok installed'
          command -v mpv
          command -v yt-dlp
          command -v ffmpeg
          test -x /opt/flow/bin/Flow
          desktop-file-validate /opt/flow/lib/flow-Flow.desktop

          launch_log=$(mktemp)
          trap 'rm -f "$launch_log"' EXIT
          set +e
          timeout --signal=TERM --kill-after=5s 15s xvfb-run -a /opt/flow/bin/Flow >"$launch_log" 2>&1
          launch_status=$?
          set -e
          if [[ "$launch_status" -ne 124 ]]; then
            cat "$launch_log"
            echo "::error::Installed Flow exited during launch smoke test with status $launch_status."
            exit 1
          fi

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v7
        with:
          name: flow-linux-deb
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
